[project]
name = "dify-workflow-mcp"
version = "0.3.0"
description = "MCP server for generating and safely syncing Dify 1.16.1 workflow DSL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
dify-workflow-mcp = "dify_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dify_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
